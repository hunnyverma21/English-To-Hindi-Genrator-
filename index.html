<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English to Hindi Translator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f6f8ff, #e7f0ff); color: #172033;
    }
    .app {
      width: min(900px, 100%); background: white; padding: 28px;
      border-radius: 22px; box-shadow: 0 18px 55px #1b35661c;
    }
    h1 { margin: 0 0 8px; text-align: center; }
    .subtitle { text-align: center; color: #667085; margin: 0 0 26px; }
    .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .panel { border: 1px solid #dbe2ef; border-radius: 15px; overflow: hidden; }
    .panel-head { padding: 13px 16px; background: #f6f8fc; font-weight: 700; }
    textarea {
      display: block; width: 100%; min-height: 220px; resize: vertical;
      border: 0; outline: none; padding: 16px; font: 16px/1.5 Arial, sans-serif;
    }
    #output { background: #fffdf7; }
    .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
    button {
      border: 0; border-radius: 10px; padding: 12px 18px; cursor: pointer;
      font-size: 15px; font-weight: 700;
    }
    .primary { background: #3156d3; color: white; }
    .secondary { background: #edf1fa; color: #263451; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { text-align: center; min-height: 22px; margin-top: 14px; color: #667085; font-size: 14px; }
    .note { font-size: 13px; color: #667085; text-align: center; margin: 14px 0 0; }
    @media (max-width: 650px) {
      .app { padding: 18px; } .panels { grid-template-columns: 1fr; }
      textarea { min-height: 160px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>English → Hindi Translator</h1>
    <p class="subtitle">Translate English text into Hindi in seconds.</p>
    <div class="panels">
      <section class="panel">
        <div class="panel-head">English</div>
        <textarea id="input" placeholder="Type or paste English text here..."></textarea>
      </section>
      <section class="panel">
        <div class="panel-head">Hindi</div>
        <textarea id="output" placeholder="हिंदी अनुवाद यहाँ दिखाई देगा..." readonly></textarea>
      </section>
    </div>
    <div class="actions">
      <button class="primary" id="translateBtn">Translate to Hindi</button>
      <button class="secondary" id="clearBtn">Clear</button>
      <button class="secondary" id="copyBtn">Copy Hindi</button>
    </div>
    <div id="status" role="status"></div>
    <p class="note">Internet connection is required for translation. Avoid entering sensitive or private information.</p>
  </main>
  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const status = document.getElementById('status');
    const translateBtn = document.getElementById('translateBtn');

    async function translate() {
      const text = input.value.trim();
      if (!text) { status.textContent = 'Please enter some English text first.'; input.focus(); return; }
      translateBtn.disabled = true;
      status.textContent = 'Translating…';
      try {
        const url = 'https://api.mymemory.translated.net/get?q=' +
          encodeURIComponent(text) + '&langpair=en|hi';
        const response = await fetch(url);
        if (!response.ok) throw new Error('Translation service is unavailable.');
        const data = await response.json();
        if (data.responseStatus !== 200 || !data.responseData?.translatedText) {
          throw new Error('Could not translate this text. Please try again.');
        }
        output.value = data.responseData.translatedText;
        status.textContent = 'Translation complete.';
      } catch (error) {
        status.textContent = 'Could not translate. Check your internet connection and try again.';
      } finally {
        translateBtn.disabled = false;
      }
    }

    translateBtn.addEventListener('click', translate);
    document.getElementById('clearBtn').addEventListener('click', () => {
      input.value = ''; output.value = ''; status.textContent = ''; input.focus();
    });
    document.getElementById('copyBtn').addEventListener('click', async () => {
      if (!output.value) { status.textContent = 'There is no Hindi text to copy yet.'; return; }
      try {
        await navigator.clipboard.writeText(output.value);
        status.textContent = 'Hindi translation copied.';
      } catch {
        output.select();
        status.textContent = 'Select the Hindi text and copy it manually.';
      }
    });
  </script>
</body>
</html>
